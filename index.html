<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Tool</title>
    
    <!-- Libraries -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { 
            font-family: 'Prompt', sans-serif; 
            background: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            min-height: 100vh;
            color: #1e293b;
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        /* Upload Zones */
        .upload-zone {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .upload-zone:hover {
            border-color: #6366f1;
            background: #f1f5f9;
            transform: translateY(-2px);
        }
        .upload-zone.active {
            background: #ecfdf5;
            border-color: #10b981;
            border-style: solid;
        }

        /* Buttons */
        .btn-wow {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }
        .btn-wow:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
            filter: brightness(1.1);
        }
        .btn-wow:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* Scrollbar */
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Loader */
        .loader-dots { display: inline-flex; gap: 4px; align-items: center; }
        .loader-dots span {
            width: 6px; height: 6px; border-radius: 50%; background: currentColor;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .loader-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loader-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        
        /* Anim */
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { animation: fadeUp 0.6s ease-out forwards; }
    </style>
</head>
<body class="flex flex-col items-center justify-center py-10 px-4">

    <!-- Main Container -->
    <div class="glass-panel w-full max-w-5xl rounded-3xl p-8 md:p-12 animate-fade-up relative overflow-hidden">
        
        <!-- Decoration -->
        <div class="absolute top-0 right-0 -mt-10 -mr-10 w-40 h-40 bg-indigo-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
        <div class="absolute bottom-0 left-0 -mb-10 -ml-10 w-40 h-40 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>

        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-10 relative z-10 border-b border-gray-200/50 pb-6">
            <div class="flex items-center gap-5">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white shadow-lg transform rotate-3 hover:rotate-0 transition-transform duration-300">
                    <i class="fa-solid fa-layer-group text-3xl"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600">
                        Data Tool
                    </h1>
                    <p class="text-gray-500 text-sm font-medium">Professional Soil Analysis Data Processor</p>
                </div>
            </div>
            <button onclick="window.location.reload()" class="mt-4 md:mt-0 p-3 text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-full transition-all" title="รีเซ็ตโปรแกรม">
                <i class="fa-solid fa-arrows-rotate text-xl"></i>
            </button>
        </div>

        <!-- Upload Section -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8 relative z-10">
            
            <!-- Source -->
            <div class="space-y-2">
                <label class="text-sm font-bold text-gray-700 ml-1 flex items-center">
                    <span class="w-6 h-6 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-xs mr-2">1</span>
                    ไฟล์ต้นฉบับ (Source)
                </label>
                <div class="upload-zone h-48 rounded-2xl flex flex-col items-center justify-center text-center p-6 relative cursor-pointer group" id="sourceBox">
                    <input type="file" id="sourceFile" accept=".xlsx, .xls" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20" onchange="handleFile(this, 'sourceBox')">
                    
                    <div class="default-content transition-all duration-300 group-hover:scale-105">
                        <div class="w-14 h-14 bg-white rounded-full shadow-sm flex items-center justify-center mx-auto mb-3 text-indigo-500 border border-indigo-50">
                            <i class="fa-solid fa-file-excel text-2xl"></i>
                        </div>
                        <h4 class="font-bold text-gray-700">อัปโหลดไฟล์ผลวิเคราะห์</h4>
                        <p class="text-xs text-gray-400 mt-1">(.xlsx)</p>
                    </div>
                    
                    <div class="success-content hidden absolute inset-0 flex flex-col items-center justify-center bg-indigo-50/80 backdrop-blur-sm z-10 rounded-2xl animate-fade-up">
                        <i class="fa-solid fa-circle-check text-5xl text-emerald-500 mb-2 shadow-sm rounded-full bg-white"></i>
                        <span class="text-sm font-bold text-gray-800 px-4 truncate w-full" id="sourceName">filename.xlsx</span>
                        <span class="text-xs text-emerald-600 font-bold uppercase tracking-wider mt-1">Ready</span>
                    </div>
                </div>
            </div>

            <!-- Target -->
            <div class="space-y-2">
                <label class="text-sm font-bold text-gray-700 ml-1 flex items-center">
                    <span class="w-6 h-6 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center text-xs mr-2">2</span>
                    ไฟล์แม่แบบ (Target)
                </label>
                <div class="upload-zone h-48 rounded-2xl flex flex-col items-center justify-center text-center p-6 relative cursor-pointer group" id="targetBox">
                    <input type="file" id="targetFile" accept=".xlsx, .xls" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20" onchange="handleFile(this, 'targetBox')">
                    
                    <div class="default-content transition-all duration-300 group-hover:scale-105">
                        <div class="w-14 h-14 bg-white rounded-full shadow-sm flex items-center justify-center mx-auto mb-3 text-purple-500 border border-purple-50">
                            <i class="fa-solid fa-table text-2xl"></i>
                        </div>
                        <h4 class="font-bold text-gray-700">อัปโหลดไฟล์ตารางเปล่า</h4>
                        <p class="text-xs text-gray-400 mt-1">(.xlsx)</p>
                    </div>
                    
                    <div class="success-content hidden absolute inset-0 flex flex-col items-center justify-center bg-purple-50/80 backdrop-blur-sm z-10 rounded-2xl animate-fade-up">
                        <i class="fa-solid fa-circle-check text-5xl text-emerald-500 mb-2 shadow-sm rounded-full bg-white"></i>
                        <span class="text-sm font-bold text-gray-800 px-4 truncate w-full" id="targetName">filename.xlsx</span>
                        <span class="text-xs text-emerald-600 font-bold uppercase tracking-wider mt-1">Ready</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Buttons -->
        <div class="flex flex-col md:flex-row gap-4 mb-8 relative z-10">
            <button onclick="previewData()" id="previewBtn" class="flex-1 py-4 rounded-xl font-bold text-gray-600 bg-white border border-gray-200 hover:bg-gray-50 hover:border-gray-300 transition-all shadow-sm flex items-center justify-center gap-2" disabled>
                <i class="fa-solid fa-magnifying-glass"></i> ตรวจสอบข้อมูล
            </button>
            <button onclick="downloadData()" id="downloadBtn" class="flex-1 py-4 rounded-xl font-bold btn-wow flex items-center justify-center gap-2 text-white shadow-lg shadow-indigo-500/30" disabled>
                <i class="fa-solid fa-bolt"></i> <span id="dlText">ประมวลผลและดาวน์โหลด</span>
            </button>
        </div>

        <!-- Preview -->
        <div id="previewSection" class="hidden transition-all duration-500 ease-in-out relative z-10">
            <div class="bg-white rounded-2xl border border-gray-100 shadow-lg overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-6 bg-indigo-500 rounded-full"></div>
                        <h3 class="font-bold text-gray-800">ตัวอย่างข้อมูล</h3>
                    </div>
                    <span id="recordCount" class="text-xs font-bold px-3 py-1 bg-green-100 text-green-700 rounded-full"></span>
                </div>
                <div class="overflow-auto max-h-[400px] custom-scroll bg-white">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-gray-50 text-gray-600 font-semibold sticky top-0 z-20 shadow-sm">
                            <tr id="previewHeader"></tr>
                        </thead>
                        <tbody id="previewBody" class="divide-y divide-gray-50"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Log -->
        <div id="logArea" class="hidden mt-4 text-center">
            <div class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-red-50 text-red-600 border border-red-100 text-sm font-medium">
                <i class="fa-solid fa-triangle-exclamation"></i> <span id="logText"></span>
            </div>
        </div>

    </div>

    <!-- Credit -->
    <div class="mt-8 text-center animate-fade-up" style="animation-delay: 0.2s;">
        <p class="text-white/90 font-medium text-sm flex items-center justify-center gap-2">
            <i class="fa-solid fa-code text-indigo-300"></i> Designed & Developed for Soil Chemistry Research Group
        </p>
    </div>

    <script>
        // --- CONFIGURATION ---
        const MAPPING = [
            { id: 'Lab No', src: ['labno'] },
            { id: 'Active Carbon', src: ['activecarbon'] },
            { id: 'BS', src: ['%bs', 'bs'] },
            { id: 'CEC', src: ['cecnh40acph7', 'cec'] },
            { id: 'EA', src: ['eabacl2', 'ea'] },
            { id: 'ECe', src: ['ece'] },
            { id: 'Exch.Al', src: ['ai-kci', 'aikci', 'alkcl', 'al-kcl'] },
            { id: 'Exch.Ca2+', src: ['exch.ca', 'exchca'] },
            { id: 'Exch.K+', src: ['exch.k', 'exchk'] },
            { id: 'Exch.Mg2+', src: ['exch.mg', 'exchmg'] },
            { id: 'Exch.Na+', src: ['exch.na', 'exchna'] },
            { id: 'Extr.Cu', src: ['cu-dtpa', 'cudtpa'] },
            { id: 'Extr.Fe', src: ['fe-dtpa', 'fedtpa'] },
            { id: 'Extr.Mn', src: ['mn-dtpa', 'mndtpa'] },
            { id: 'Extr.Na', src: ['avail.na', 'availna', 'extr.na'] },
            { id: 'Extr.S', src: ['s-nh4oacph5', 'snh4', 'extr.s'] },
            { id: 'Extr.Zn', src: ['zn-dtpa', 'zndtpa'] },
            { id: 'Fe2O3', src: ['fe-dcb', 'fedcb', 'fe2o3'] },
            { id: 'GR', src: ['gr'] },
            { id: 'LR', src: ['lr'] },
            { id: 'OC', src: ['oc'] },
            { id: 'pHCaCl2', src: ['phcaci2', 'phcacl2'] },
            { id: 'pHH2O', src: ['phh2o', 'phh20'] },
            { id: 'pHKCl', src: ['phkci', 'phkcl'] },
            { id: 'Sol.Ca2+', src: ['sol.ca2+', 'solca2+', 'sol.ca'] },
            { id: 'Sol.Cl-', src: ['sol.cl-', 'solcl-'] },
            { id: 'Sol.CO32-', src: ['sol.co32-', 'solco32-'] },
            { id: 'Sol.HCO3-', src: ['sol.hco3-', 'solhco3-'] },
            { id: 'Sol.K+', src: ['sol.k+', 'solk+', 'sol.k'] },
            { id: 'Sol.Mg2+', src: ['sol.mg2+', 'solmg2+', 'sol.mg'] },
            { id: 'Sol.Na+', src: ['sol.na+', 'solna+', 'sol.na'] },
            { id: 'Sol.SO42-', src: ['sol.so42-', 'solso42-'] },
            { id: 'ค่าการนำไฟฟ้า5/ (EC)', src: ['ec1:5', 'ec15'] },
            { id: 'แคลเซียม3/(Ca)', src: ['avail.ca', 'availca'] },
            { id: 'โพแทสเซียม3/ (K)', src: ['avail.k', 'availk'] },
            { id: 'ฟอสฟอรัส2/ (P)', src: ['p', 'pbray', 'p-bray', 'ฟอสฟอรัส'] }, // Keep 'p' here, logic handles collision
            { id: 'แมกนีเซียม3/ (Mg)', src: ['avail.mg', 'availmg'] },
            { id: 'อินทรียวัตถุ1/ (OM)', src: ['om', 'อินทรียวัตถุ'] }
        ];

        let sourceDataMap = {}; 
        let targetWorkbook = null;
        let targetInfo = {};

        // UI Handlers
        function handleFile(input, boxId) {
            const file = input.files[0];
            if (file) {
                const box = document.getElementById(boxId);
                const nameSpan = box.querySelector(boxId === 'sourceBox' ? '#sourceName' : '#targetName');
                nameSpan.innerText = file.name;
                box.querySelector('.default-content').classList.add('hidden');
                box.querySelector('.success-content').classList.remove('hidden');
                box.classList.add('active');
            }
            checkButtons();
        }

        function checkButtons() {
            const f1 = document.getElementById('sourceFile').files[0];
            const f2 = document.getElementById('targetFile').files[0];
            if(f1 && f2) document.getElementById('previewBtn').disabled = false;
        }

        function log(msg) {
            const area = document.getElementById('logArea');
            const text = document.getElementById('logText');
            area.classList.remove('hidden');
            text.innerText = msg;
        }

        // Logic Helpers
        function getSafeStr(cellVal) {
            if (cellVal === null || cellVal === undefined) return '';
            if (typeof cellVal === 'object') {
                if (cellVal.richText) return cellVal.richText.map(t => t.text).join('');
                return cellVal.text || cellVal.result || '';
            }
            return String(cellVal);
        }

        function cleanStr(s) {
            return getSafeStr(s).toLowerCase().replace(/[\s\.\/\-\(\)]/g, '');
        }

        // Main Functions
        async function previewData() {
            const btn = document.getElementById('previewBtn');
            const originalText = btn.innerHTML; // No more error here, using proper variable scope
            btn.disabled = true;
            btn.innerHTML = '<div class="loader-dots"><span></span><span></span><span></span></div>';
            
            document.getElementById('logArea').classList.add('hidden');
            document.getElementById('previewSection').classList.add('hidden');
            
            try {
                // 1. Source
                const sFile = document.getElementById('sourceFile').files[0];
                const sBuf = await readFile(sFile);
                const sWb = XLSX.read(sBuf, {type:'array'});
                
                const sheetName = sWb.SheetNames.find(n => n.includes('ผลวิเคราะห์'));
                if (!sheetName) throw new Error("ไม่พบ Sheet 'ผลวิเคราะห์' ในไฟล์ต้นฉบับ");
                
                const sSheet = sWb.Sheets[sheetName];
                const sDataFull = XLSX.utils.sheet_to_json(sSheet, {header:1, raw:false, defval:''});
                
                let sHeaderIdx = -1, sLabIdx = -1;
                for(let i=0; i<Math.min(sDataFull.length, 50); i++) {
                    const row = sDataFull[i];
                    for(let j=0; j<row.length; j++) {
                        if(cleanStr(row[j]).includes('labno')) {
                            sHeaderIdx = i; sLabIdx = j; break;
                        }
                    }
                    if(sHeaderIdx !== -1) break;
                }

                if(sHeaderIdx === -1) throw new Error("ไม่พบหัวตาราง 'Lab No.' ใน Sheet ผลวิเคราะห์");

                const sHeaderRow = sDataFull[sHeaderIdx];
                const sourceColMap = {}; 
                
                MAPPING.forEach(m => {
                    if(m.id === 'Lab No') return;
                    for(let j=0; j<sHeaderRow.length; j++) {
                        const h = cleanStr(sHeaderRow[j]);
                        // STRICT P MATCHING LOGIC
                        if(m.src.some(k => {
                            const ck = cleanStr(k);
                            // If keyword is 'p', enforce strict match to avoid 'ph'
                            if (ck === 'p') return h === ck;
                            return h === ck || h.includes(ck);
                        })) {
                            sourceColMap[m.id] = j; break; 
                        }
                    }
                });

                sourceDataMap = {}; 
                let count = 0;
                for(let i=sHeaderIdx+1; i<sDataFull.length; i++) {
                    const row = sDataFull[i];
                    const labNo = String(row[sLabIdx]||'').trim();
                    if(!labNo || labNo.length < 3 || labNo.includes('(')) continue;

                    if(!sourceDataMap[labNo]) sourceDataMap[labNo] = {};
                    for(let [id, colIdx] of Object.entries(sourceColMap)) {
                        const val = row[colIdx];
                        if(val !== undefined && val !== '') sourceDataMap[labNo][id] = val;
                    }
                    count++;
                }

                // 2. Target
                const tFile = document.getElementById('targetFile').files[0];
                const tBuf = await readFile(tFile);
                targetWorkbook = new ExcelJS.Workbook();
                await targetWorkbook.xlsx.load(tBuf);
                const ws = targetWorkbook.getWorksheet(1);

                let tHeaderIdx = -1, tLabIdx = -1;
                const tColMap = {}; 

                ws.eachRow((row, rIdx) => {
                    if(tHeaderIdx !== -1) return;
                    row.eachCell((cell, cIdx) => {
                        const val = cleanStr(getSafeStr(cell.value));
                        if(val.includes('เลขปฏิบัติการ') || val.includes('เลขที่ปฏิบัติการ') || val.includes('labno')) {
                            tHeaderIdx = rIdx; tLabIdx = cIdx;
                        }
                    });

                    if(tHeaderIdx === rIdx) {
                        row.eachCell((cell, cIdx) => {
                            const val = cleanStr(getSafeStr(cell.value));
                            MAPPING.forEach(m => {
                                if(m.id === 'Lab No') return;
                                const idKey = cleanStr(m.id.split('/')[0]); 
                                if(val.includes(idKey) || val.includes(cleanStr(m.id))) {
                                    tColMap[m.id] = cIdx;
                                }
                            });
                        });
                    }
                });

                if(tHeaderIdx === -1) throw new Error("ไม่พบ 'เลขปฏิบัติการ' ในไฟล์แม่แบบ");
                targetInfo = { tHeaderIdx, tLabIdx, tColMap };

                // Render Preview
                const foundIds = MAPPING.filter(m => tColMap[m.id] !== undefined && m.id !== 'Lab No').map(m => m.id);
                let headHtml = '<th class="px-6 py-4 sticky left-0 z-20 bg-[#f8fafc] border-b border-gray-100 text-indigo-900 shadow-sm">Lab No.</th>';
                foundIds.forEach(id => {
                    headHtml += `<th class="px-6 py-4 border-b border-gray-100 text-gray-600 font-medium">${id}</th>`;
                });
                document.getElementById('previewHeader').innerHTML = headHtml;

                let previewHtml = '';
                let previewCount = 0;
                ws.eachRow((row, rIdx) => {
                    if(rIdx <= tHeaderIdx || previewCount >= 5) return;
                    const labNo = String(getSafeStr(row.getCell(tLabIdx).value)).trim();
                    if(sourceDataMap[labNo]) {
                        let rowHtml = `<tr class="hover:bg-indigo-50/40 transition-colors duration-150"><td class="px-6 py-3 font-semibold text-gray-800 border-b border-gray-50 bg-white sticky left-0 z-10 shadow-sm">${labNo}</td>`;
                        const data = sourceDataMap[labNo];
                        foundIds.forEach(id => {
                            const val = data[id];
                            const display = (val === undefined || val === '') ? '-' : val;
                            const colorClass = display === '-' ? 'text-gray-300' : 'text-indigo-600 font-medium';
                            rowHtml += `<td class="px-6 py-3 border-b border-gray-50 ${colorClass}">${display}</td>`;
                        });
                        rowHtml += '</tr>';
                        previewHtml += rowHtml;
                        previewCount++;
                    }
                });

                if(previewCount === 0) {
                     previewHtml = '<tr><td colspan="100%" class="p-8 text-center text-gray-400">ไม่พบ Lab No. ที่ตรงกัน</td></tr>';
                } else {
                    document.getElementById('downloadBtn').disabled = false;
                    document.getElementById('recordCount').innerHTML = `<i class="fa-solid fa-check mr-1"></i> พบ ${count} รายการ`;
                }

                document.getElementById('previewBody').innerHTML = previewHtml;
                document.getElementById('previewSection').classList.remove('hidden');
                
            } catch (e) {
                console.error(e);
                log(e.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> ตรวจสอบข้อมูล'; // Safe reset
            }
        }

        async function downloadData() {
            const btn = document.getElementById('downloadBtn');
            const dlText = document.getElementById('dlText');
            const originalText = dlText.innerText;
            
            btn.disabled = true;
            dlText.innerText = 'กำลังประมวลผล...';
            
            try {
                const ws = targetWorkbook.getWorksheet(1);

                // --- SMART HEADER CLEANING (Rich Text Safe) ---
                for (let r = 1; r <= targetInfo.tHeaderIdx; r++) {
                    const row = ws.getRow(r);
                    row.eachCell({ includeEmpty: true }, (cell) => {
                        // 1. Preserve Rich Text Structure but clean styles
                        if (cell.value && typeof cell.value === 'object' && 'richText' in cell.value) {
                            const newRichText = cell.value.richText.map(part => {
                                const newFont = { ...(part.font || {}) };
                                newFont.strike = false;
                                newFont.bold = false;
                                newFont.italic = false;
                                return { ...part, font: newFont };
                            });
                            cell.value = { richText: newRichText };
                        } else {
                            // 2. Standard Value: Remove style
                            const oldFont = cell.font || {};
                            cell.font = {
                                ...oldFont,
                                strike: false,
                                bold: false,
                                italic: false,
                            };
                        }
                    });
                }

                // Write Data
                ws.eachRow((row, rIdx) => {
                    if(rIdx <= targetInfo.tHeaderIdx) return;
                    const labNo = String(getSafeStr(row.getCell(targetInfo.tLabIdx).value)).trim();
                    if(sourceDataMap[labNo]) {
                        const data = sourceDataMap[labNo];
                        Object.entries(targetInfo.tColMap).forEach(([id, cIdx]) => {
                            const val = data[id];
                            if(val !== undefined && val !== '') {
                                const cell = row.getCell(cIdx);
                                cell.value = val;
                                // Clean Data Cells
                                cell.font = {
                                    name: 'Calibri',
                                    size: 11,
                                    bold: false,
                                    italic: false,
                                    strike: false,
                                    color: { argb: 'FF000000' }
                                };
                            }
                        });
                    }
                });

                const buffer = await targetWorkbook.xlsx.writeBuffer();
                const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "ผลวิเคราะห์_สมบูรณ์.xlsx";
                a.click();
                
            } catch (e) {
                log(e.message);
            } finally {
                btn.disabled = false;
                dlText.innerText = 'เรียบร้อย (ดาวน์โหลดอีกครั้ง)';
                setTimeout(() => { dlText.innerText = originalText; }, 3000);
            }
        }

        function readFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.onerror = reject;
                reader.readAsArrayBuffer(file);
            });
        }
    </script>
</body>
