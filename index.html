<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Tool</title>
    
    <!-- ไลบรารี -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: #f3f4f6;
            background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-attachment: fixed;
            background-size: cover;
            min-height: 100vh;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.5);
        }

        .upload-card {
            background: white;
            border-radius: 12px;
            border: 2px dashed #e5e7eb;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .upload-card:hover {
            border-color: #4f46e5;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .upload-card.selected {
            border-color: #10b981;
            background: #f0fdf4;
        }

        .btn-gradient {
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
        }
        
        .btn-gradient:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
            filter: brightness(1.1);
        }

        .btn-gradient:disabled {
            background: #9ca3af;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Loader Animation */
        .dot-flashing {
            position: relative;
            width: 8px;
            height: 8px;
            border-radius: 5px;
            background-color: #fff;
            color: #fff;
            animation: dot-flashing 1s infinite linear alternate;
            animation-delay: 0.5s;
        }
        .dot-flashing::before, .dot-flashing::after {
            content: "";
            display: inline-block;
            position: absolute;
            top: 0;
        }
        .dot-flashing::before {
            left: -12px;
            width: 8px; height: 8px;
            border-radius: 5px;
            background-color: #fff;
            animation: dot-flashing 1s infinite alternate;
            animation-delay: 0s;
        }
        .dot-flashing::after {
            left: 12px;
            width: 8px; height: 8px;
            border-radius: 5px;
            background-color: #fff;
            animation: dot-flashing 1s infinite alternate;
            animation-delay: 1s;
        }
        @keyframes dot-flashing {
            0% { background-color: #fff; }
            50%, 100% { background-color: rgba(255,255,255,0.2); }
        }
    </style>
</head>
<body class="flex flex-col items-center py-10 px-4">

    <div class="glass-panel w-full max-w-5xl p-8 animate-fade-in-up">
        
        <div class="flex flex-col md:flex-row justify-between items-center mb-10 border-b border-gray-100 pb-6">
            <div class="flex items-center gap-4 mb-4 md:mb-0">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-white shadow-lg">
                    <i class="fa-solid fa-layer-group text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-bold text-gray-800 tracking-tight">Data Tool</h1>
                    <p class="text-gray-500 text-sm font-light">เครื่องมือจัดการข้อมูลอัจฉริยะ (V26 Rich Text Safe)</p>
                </div>
            </div>
            <button onclick="window.location.reload()" class="text-gray-400 hover:text-indigo-600 transition-colors" title="รีเซ็ต">
                <i class="fa-solid fa-arrows-rotate text-xl"></i>
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="space-y-3">
                <label class="block text-sm font-semibold text-gray-700 ml-1">
                    <i class="fa-solid fa-1 text-indigo-500 mr-2"></i>ไฟล์ต้นฉบับ (Source)
                </label>
                <div class="relative h-48 group">
                    <input type="file" id="sourceFile" accept=".xlsx, .xls" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" onchange="handleFile(this, 'sourceBox')">
                    <div id="sourceBox" class="upload-card w-full h-full flex flex-col items-center justify-center text-center p-6">
                        <div class="w-16 h-16 rounded-full bg-indigo-50 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                            <i class="fa-solid fa-file-import text-2xl text-indigo-500"></i>
                        </div>
                        <h4 class="font-medium text-gray-700">อัปโหลดไฟล์ผลวิเคราะห์</h4>
                        <p class="text-xs text-gray-400 mt-1">ลากไฟล์มาวาง หรือคลิกเพื่อเลือก</p>
                    </div>
                </div>
            </div>

            <div class="space-y-3">
                <label class="block text-sm font-semibold text-gray-700 ml-1">
                    <i class="fa-solid fa-2 text-indigo-500 mr-2"></i>ไฟล์แม่แบบ (Target)
                </label>
                <div class="relative h-48 group">
                    <input type="file" id="targetFile" accept=".xlsx, .xls" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" onchange="handleFile(this, 'targetBox')">
                    <div id="targetBox" class="upload-card w-full h-full flex flex-col items-center justify-center text-center p-6">
                        <div class="w-16 h-16 rounded-full bg-purple-50 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                            <i class="fa-solid fa-table text-2xl text-purple-500"></i>
                        </div>
                        <h4 class="font-medium text-gray-700">อัปโหลดไฟล์ตารางเปล่า</h4>
                        <p class="text-xs text-gray-400 mt-1">ลากไฟล์มาวาง หรือคลิกเพื่อเลือก</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex flex-col md:flex-row gap-4 mb-8">
            <button onclick="previewData()" id="previewBtn" class="flex-1 py-4 rounded-xl font-semibold bg-white border border-gray-200 text-gray-700 hover:bg-gray-50 hover:border-gray-300 transition-all shadow-sm" disabled>
                <i class="fa-solid fa-magnifying-glass mr-2"></i>ตรวจสอบข้อมูล
            </button>
            <button onclick="downloadData()" id="downloadBtn" class="flex-1 py-4 rounded-xl font-semibold btn-gradient flex items-center justify-center gap-2" disabled>
                <span id="btnText"><i class="fa-solid fa-bolt mr-2"></i>ประมวลผลและดาวน์โหลด</span>
            </button>
        </div>

        <div id="previewSection" class="hidden transition-all duration-500 ease-in-out">
            <div class="bg-gray-50 rounded-xl border border-gray-200 overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-200 bg-white flex justify-between items-center">
                    <h3 class="font-bold text-gray-800 flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-indigo-500"></i> ตัวอย่างข้อมูล
                    </h3>
                    <span id="recordCount" class="text-xs font-medium px-3 py-1 bg-indigo-100 text-indigo-700 rounded-full"></span>
                </div>
                <div class="overflow-auto max-h-[400px]">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-50 text-gray-600 font-semibold sticky top-0 z-10 shadow-sm">
                            <tr id="previewHeader"></tr>
                        </thead>
                        <tbody id="previewBody" class="bg-white divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="logArea" class="hidden mt-4 text-center text-sm text-red-500 bg-red-50 p-3 rounded-lg border border-red-100"></div>

    </div>

    <div class="mt-8 text-center text-white/80 animate-fade-in">
        <p class="font-medium text-lg mb-1 flex items-center justify-center gap-2">
            <i class="fa-solid fa-flask"></i> Designed & Developed for Soil Chemistry Research Group
        </p>
    </div>

    <script>
        // MAPPING CONFIGURATION (Complete)
        const MAPPING = [
            { id: 'Lab No', src: ['labno'] },
            { id: 'pHH2O', src: ['phh2o', 'phh20'] },
            { id: 'pHKCl', src: ['phkci', 'phkcl'] },
            { id: 'pHCaCl2', src: ['phcaci2', 'phcacl2'] },
            { id: 'ค่าการนำไฟฟ้า5/ (EC)', src: ['ec1:5', 'ec15'] },
            { id: 'อินทรียวัตถุ1/ (OM)', src: ['om', 'อินทรียวัตถุ'] },
            { id: 'OC', src: ['oc'] },
            { id: 'ฟอสฟอรัส2/ (P)', src: ['p', 'pbray', 'p-bray', 'ฟอสฟอรัส'] },
            { id: 'โพแทสเซียม3/ (K)', src: ['avail.k', 'availk'] }, 
            { id: 'แคลเซียม3/(Ca)', src: ['avail.ca', 'availca'] }, 
            { id: 'แมกนีเซียม3/ (Mg)', src: ['avail.mg', 'availmg'] },
            { id: 'Extr.Na', src: ['avail.na', 'availna', 'extr.na'] },
            { id: 'Exch.Al', src: ['ai-kci', 'aikci', 'alkcl', 'al-kcl'] },
            { id: 'Exch.Ca2+', src: ['exch.ca', 'exchca'] },
            { id: 'Exch.K+', src: ['exch.k', 'exchk'] },
            { id: 'Exch.Mg2+', src: ['exch.mg', 'exchmg'] },
            { id: 'Exch.Na+', src: ['exch.na', 'exchna'] },
            { id: 'Sol.Ca2+', src: ['sol.ca2+', 'solca2+', 'sol.ca'] },
            { id: 'Sol.K+', src: ['sol.k+', 'solk+', 'sol.k'] },
            { id: 'Sol.Mg2+', src: ['sol.mg2+', 'solmg2+', 'sol.mg'] },
            { id: 'Sol.Na+', src: ['sol.na+', 'solna+', 'sol.na'] },
            { id: 'Sol.Cl-', src: ['sol.cl-', 'solcl-'] },
            { id: 'Sol.CO32-', src: ['sol.co32-', 'solco32-'] },
            { id: 'Sol.HCO3-', src: ['sol.hco3-', 'solhco3-'] },
            { id: 'Sol.SO42-', src: ['sol.so42-', 'solso42-'] },
            { id: 'Extr.Cu', src: ['cu-dtpa', 'cudtpa'] },
            { id: 'Extr.Fe', src: ['fe-dtpa', 'fedtpa'] },
            { id: 'Extr.Mn', src: ['mn-dtpa', 'mndtpa'] },
            { id: 'Extr.Zn', src: ['zn-dtpa', 'zndtpa'] },
            { id: 'Fe2O3', src: ['fe-dcb', 'fedcb', 'fe2o3'] },
            { id: 'Extr.S', src: ['s-nh4oacph5', 'snh4', 'extr.s'] },
            { id: 'Active Carbon', src: ['activecarbon'] },
            { id: 'CEC', src: ['cecnh40acph7', 'cec'] },
            { id: 'BS', src: ['%bs', 'bs'] },
            { id: 'EA', src: ['ea-bacl2', 'eabacl2', 'ea'] },
            { id: 'ECe', src: ['ece'] },
            { id: 'GR', src: ['gr'] },
            { id: 'LR', src: ['lr'] }
        ];

        let sourceDataMap = {}; 
        let targetWorkbook = null;
        let targetInfo = {};

        function handleFile(input, boxId) {
            const name = input.files[0]?.name;
            const box = document.getElementById(boxId);
            if(name) {
                box.innerHTML = `
                    <div class="flex flex-col items-center animate-bounce-short">
                        <div class="w-12 h-12 rounded-full bg-green-100 flex items-center justify-center mb-2">
                            <i class="fa-solid fa-check text-green-600 text-xl"></i>
                        </div>
                        <span class="font-bold text-gray-800 text-sm truncate max-w-[200px]">${name}</span>
                        <span class="text-xs text-green-600 mt-1">พร้อมใช้งาน</span>
                    </div>`;
                box.classList.add('selected');
            }
            checkButtons();
        }

        function checkButtons() {
            const f1 = document.getElementById('sourceFile').files[0];
            const f2 = document.getElementById('targetFile').files[0];
            if(f1 && f2) document.getElementById('previewBtn').disabled = false;
        }

        function log(msg) {
            const el = document.getElementById('logArea');
            el.classList.remove('hidden');
            el.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-2"></i> ${msg}`;
        }

        function getSafeStr(cellVal) {
            if (cellVal === null || cellVal === undefined) return '';
            if (typeof cellVal === 'object') {
                if (cellVal.richText) return cellVal.richText.map(t => t.text).join('');
                return cellVal.text || cellVal.result || '';
            }
            return String(cellVal);
        }

        function cleanStr(s) {
            return getSafeStr(s).toLowerCase().replace(/[\s\.\/\-\(\)]/g, '');
        }

        async function previewData() {
            const btn = document.getElementById('previewBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<div class="dot-flashing mx-auto"></div>';
            
            document.getElementById('logArea').classList.add('hidden');
            document.getElementById('previewSection').classList.add('hidden');
            
            try {
                // 1. Source Reading
                const sFile = document.getElementById('sourceFile').files[0];
                const sBuf = await readFile(sFile);
                const sWb = XLSX.read(sBuf, {type:'array'});
                
                const sheetName = sWb.SheetNames.find(n => n.includes('ผลวิเคราะห์'));
                if (!sheetName) throw new Error("ไม่พบ Sheet 'ผลวิเคราะห์' ในไฟล์ต้นฉบับ");
                
                const sSheet = sWb.Sheets[sheetName];
                const sDataFull = XLSX.utils.sheet_to_json(sSheet, {header:1, raw:false, defval:''});
                
                let sHeaderIdx = -1, sLabIdx = -1;
                for(let i=0; i<Math.min(sDataFull.length, 50); i++) {
                    const row = sDataFull[i];
                    for(let j=0; j<row.length; j++) {
                        if(cleanStr(row[j]).includes('labno')) {
                            sHeaderIdx = i; sLabIdx = j; break;
                        }
                    }
                    if(sHeaderIdx !== -1) break;
                }

                if(sHeaderIdx === -1) throw new Error("ไม่พบหัวตาราง 'Lab No.' ใน Sheet ผลวิเคราะห์");

                const sHeaderRow = sDataFull[sHeaderIdx];
                const sourceColMap = {}; 
                
                MAPPING.forEach(m => {
                    if(m.id === 'Lab No') return;
                    for(let j=0; j<sHeaderRow.length; j++) {
                        const h = cleanStr(sHeaderRow[j]);
                        if(m.src.some(k => h === cleanStr(k) || h.includes(cleanStr(k)))) {
                            sourceColMap[m.id] = j; break; 
                        }
                    }
                });

                sourceDataMap = {}; 
                let count = 0;
                for(let i=sHeaderIdx+1; i<sDataFull.length; i++) {
                    const row = sDataFull[i];
                    const labNo = String(row[sLabIdx]||'').trim();
                    if(!labNo || labNo.length < 3 || labNo.includes('(')) continue;

                    if(!sourceDataMap[labNo]) sourceDataMap[labNo] = {};
                    for(let [id, colIdx] of Object.entries(sourceColMap)) {
                        const val = row[colIdx];
                        if(val !== undefined && val !== '') sourceDataMap[labNo][id] = val;
                    }
                    count++;
                }

                // 2. Target Reading
                const tFile = document.getElementById('targetFile').files[0];
                const tBuf = await readFile(tFile);
                targetWorkbook = new ExcelJS.Workbook();
                await targetWorkbook.xlsx.load(tBuf);
                const ws = targetWorkbook.getWorksheet(1);

                let tHeaderIdx = -1, tLabIdx = -1;
                const tColMap = {}; 

                ws.eachRow((row, rIdx) => {
                    if(tHeaderIdx !== -1) return;
                    row.eachCell((cell, cIdx) => {
                        const val = cleanStr(getSafeStr(cell.value));
                        if(val.includes('เลขปฏิบัติการ') || val.includes('เลขที่ปฏิบัติการ') || val.includes('labno')) {
                            tHeaderIdx = rIdx; tLabIdx = cIdx;
                        }
                    });

                    if(tHeaderIdx === rIdx) {
                        row.eachCell((cell, cIdx) => {
                            const val = cleanStr(getSafeStr(cell.value));
                            MAPPING.forEach(m => {
                                if(m.id === 'Lab No') return;
                                const idKey = cleanStr(m.id.split('/')[0]); 
                                if(val.includes(idKey) || val.includes(cleanStr(m.id))) {
                                    tColMap[m.id] = cIdx;
                                }
                            });
                        });
                    }
                });

                if(tHeaderIdx === -1) throw new Error("ไม่พบ 'เลขปฏิบัติการ' ในไฟล์แม่แบบ");
                targetInfo = { tHeaderIdx, tLabIdx, tColMap };

                // 3. Render Preview
                const foundIds = MAPPING.filter(m => tColMap[m.id] !== undefined && m.id !== 'Lab No').map(m => m.id);
                let headHtml = '<th class="px-6 py-3 sticky left-0 z-20 bg-[#f0f2f5] border-b border-r shadow-sm">Lab No.</th>';
                foundIds.forEach(id => {
                    headHtml += `<th class="px-6 py-3 text-center border-b border-r">${id}</th>`;
                });
                document.getElementById('previewHeader').innerHTML = headHtml;

                let previewHtml = '';
                let previewCount = 0;
                ws.eachRow((row, rIdx) => {
                    if(rIdx <= tHeaderIdx || previewCount >= 5) return;
                    const labNo = String(getSafeStr(row.getCell(tLabIdx).value)).trim();
                    if(sourceDataMap[labNo]) {
                        let rowHtml = `<tr class="hover:bg-indigo-50/30 transition-colors"><td class="px-6 py-4 border-b border-gray-100 bg-white sticky left-0 z-10 font-bold text-gray-800 shadow-sm">${labNo}</td>`;
                        const data = sourceDataMap[labNo];
                        foundIds.forEach(id => {
                            const val = data[id];
                            const display = (val === undefined || val === '') ? '-' : val;
                            const colorClass = display === '-' ? 'text-gray-300' : 'text-indigo-600 font-medium';
                            rowHtml += `<td class="px-6 py-4 border-b border-gray-100 ${colorClass}">${display}</td>`;
                        });
                        rowHtml += '</tr>';
                        previewHtml += rowHtml;
                        previewCount++;
                    }
                });

                if(previewCount === 0) {
                     previewHtml = '<tr><td colspan="100%" class="p-8 text-center text-gray-400">ไม่พบ Lab No. ที่ตรงกัน</td></tr>';
                } else {
                    document.getElementById('downloadBtn').disabled = false;
                    document.getElementById('recordCount').innerHTML = `<i class="fa-solid fa-check mr-1"></i> พบ ${count} รายการ`;
                }

                document.getElementById('previewBody').innerHTML = previewHtml;
                document.getElementById('previewSection').classList.remove('hidden');
                
            } catch (e) {
                console.error(e);
                log(e.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        async function downloadData() {
            const btn = document.getElementById('downloadBtn');
            const btnText = document.getElementById('btnText');
            const originalContent = btnText.innerHTML;
            
            btn.disabled = true;
            btnText.innerHTML = '<div class="dot-flashing mx-auto"></div>';
            
            try {
                const ws = targetWorkbook.getWorksheet(1);

                // --- SMART CLEANER FOR HEADERS (Preserve Rich Text) ---
                for (let r = 1; r <= targetInfo.tHeaderIdx; r++) {
                    const row = ws.getRow(r);
                    row.eachCell({ includeEmpty: true }, (cell) => {
                        // Logic: Disable strike/bold/italic, Keep everything else
                        
                        // Case A: Rich Text Object
                        if (cell.value && typeof cell.value === 'object' && 'richText' in cell.value) {
                            const newRichText = cell.value.richText.map(part => {
                                // Clone font or create empty object
                                const newFont = { ...(part.font || {}) };
                                // Force disable these specific styles
                                newFont.strike = false;
                                newFont.bold = false;
                                newFont.italic = false;
                                // Return updated part
                                return { ...part, font: newFont };
                            });
                            cell.value = { richText: newRichText };
                        } 
                        // Case B: Simple Value (String/Number/Formula)
                        else {
                            const oldFont = cell.font || {};
                            cell.font = {
                                ...oldFont,
                                strike: false,
                                bold: false,
                                italic: false,
                                // Note: We don't overwrite color or name here to keep template style
                            };
                        }
                    });
                }

                // Write Data
                ws.eachRow((row, rIdx) => {
                    if(rIdx <= targetInfo.tHeaderIdx) return;
                    const labNo = String(getSafeStr(row.getCell(targetInfo.tLabIdx).value)).trim();
                    if(sourceDataMap[labNo]) {
                        const data = sourceDataMap[labNo];
                        Object.entries(targetInfo.tColMap).forEach(([id, cIdx]) => {
                            const val = data[id];
                            if(val !== undefined && val !== '') {
                                const cell = row.getCell(cIdx);
                                cell.value = val;
                                // Set data cells to standard clean font
                                cell.font = {
                                    name: 'Calibri',
                                    size: 11,
                                    bold: false,
                                    italic: false,
                                    strike: false,
                                    color: { argb: 'FF000000' }
                                };
                            }
                        });
                    }
                });

                const buffer = await targetWorkbook.xlsx.writeBuffer();
                const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "ผลวิเคราะห์_สมบูรณ์.xlsx";
                a.click();
                
            } catch (e) {
                log(e.message);
            } finally {
                btn.disabled = false;
                btnText.innerHTML = '<i class="fa-solid fa-check mr-2"></i>ดาวน์โหลดเรียบร้อย';
                setTimeout(() => {
                    btnText.innerHTML = originalContent;
                }, 3000);
            }
        }

        function readFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.onerror = reject;
                reader.readAsArrayBuffer(file);
            });
        }
    </script>
</body>
</html>
